<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Constructora — se mudó al POS</title>
<!-- La app de impresiones (Firebase) se retiró: ventas, impresiones e historial están en el POS (Supabase). -->
<meta http-equiv="refresh" content="3; url=https://web-five-kohl-92.vercel.app/">

<style>
  :root { --bg: #f5f5f4; --card: #fff; --ink: #1c1917; --soft: #57534e; --accent: #b45309; }

  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border-radius: 12px; padding: 24px; max-width: 420px; text-align: center;

  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--soft); margin: 0 0 16px; line-height: 1.5; }
  a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 20px;
      border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>La app de impresiones se mudó</h1>
