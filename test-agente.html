<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba: agente local</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#1E2A32}
  #resultado{margin-top:16px;padding:16px;border-radius:8px;font-size:14px;white-space:pre-wrap}
  .ok{background:#E4F2EC;color:#1F7A63}
  .fail{background:#F7E7E2;color:#B3452C}
  .pending{background:#F5F3EE;color:#5A6B75}
  button{font-size:15px;padding:10px 16px;border-radius:8px;border:1px solid #ccc;cursor:pointer;margin-right:8px}
  code{background:#eee;padding:2px 6px;border-radius:4px}
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eee}
  #estado{font-size:13px;color:#5A6B75;margin-top:10px}
</style>
</head>
<body>
  <h2>Prueba: agente local</h2>
  <p>Esta página se sirve por HTTPS (GitHub Pages) y le habla al agente en <code>http://localhost:4000</code>. Ábrela en la PC donde corre <code>npm start</code> dentro de <code>collector-agent</code>.</p>
  <button id="btnHealth">Probar conexión (/health)</button>
  <button id="btnJobsToggle">Empezar a escuchar trabajos (/jobs)</button>
  <div id="resultado" class="pending">Todavía no probado.</div>
  <div id="estado"></div>
  <table id="tabla" style="display:none">
    <thead><tr><th>#</th><th>Fuente</th><th>Impresora</th><th>Hojas</th><th>Color</th><th>Hora</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

<script>
const out = document.getElementById('resultado');
const estado = document.getElementById('estado');
const tabla = document.getElementById('tabla');
const tbody = document.getElementById('tbody');
let vistos = new Set();
let polling = null;

async function probarHealth(){
  out.className = 'pending'; out.textContent = 'Probando…';
  try{
    const res = await fetch('http://localhost:4000/health');
    const data = await res.json();
    out.className = 'ok';
    out.textContent = '✅ ¡Funcionó! Respuesta del agente:\n' + JSON.stringify(data, null, 2);
  }catch(err){
    out.className = 'fail';
    out.textContent = '❌ No se pudo conectar.\nError: ' + err.message +
      '\n\nRevisa que "npm start" esté corriendo en esa PC y que estés abriendo esta página en la MISMA PC.';
  }
}

async function chequearJobs(){
  try{
    const res = await fetch('http://localhost:4000/jobs');
    const jobs = await res.json();
    estado.textContent = `Conectado — ${jobs.length} trabajo(s) en el buffer del agente. Escuchando cada 5s…`;
    jobs.forEach(j=>{
      if(vistos.has(j.id)) return;
      vistos.add(j.id);
      tabla.style.display='';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${j.seq}</td><td>${j.fuente}</td><td>${j.impresora||''}</td><td>${j.hojas}</td><td>${j.color?'Sí':'No'}</td><td>${j.timestamp||''}</td>`;
      tbody.prepend(tr);
    });
  }catch(err){
    estado.textContent = '❌ Se cortó la conexión con el agente: ' + err.message;
  }
}

document.getElementById('btnHealth').addEventListener('click', probarHealth);
document.getElementById('btnJobsToggle').addEventListener('click', (e)=>{
  if(polling){
    clearInterval(polling); polling=null;
    e.target.textContent = 'Empezar a escuchar trabajos (/jobs)';
    estado.textContent = 'Detenido.';
  }else{
    chequearJobs();
    polling = setInterval(chequearJobs, 5000);
    e.target.textContent = 'Detener';
  }
});
</script>
</body>
</html>
